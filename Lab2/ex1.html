<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Age Check</title>
<style>
   body {
     margin: 0;
     height: 100vh;
     background-color: #2f2f2f;
     display: flex;
     justify-content: center;
     align-items: center;
     font-family: Arial, sans-serif;
     color: white;
   }
   .container {
     width: 320px;
     display: flex;
     flex-direction: column;
     gap: 12px;
   }
   label {
     font-size: 18px;
   }
   input {
     padding: 10px;
     font-size: 16px;
     background: transparent;
     border: 2px solid white;
     color: white;
     outline: none;
   }
   button {
     margin-top: 10px;
     padding: 10px;
     font-size: 16px;
     background: transparent;
     border: 2px solid white;
     color: white;
     cursor: pointer;
   }
   button:hover {
     background: white;
     color: black;
   }
   #result {
     margin-top: 10px;
     font-size: 18px;
   }
</style>
</head>
<body>
<div class="container">
<label>Name:</label>
<input type="text" id="name" placeholder="abc">
<label>Age:</label>
<input type="number" id="age" placeholder="18">
<button onclick="checkAge()">Welcome</button>
<div id="result"></div>
</div>
<script>
   function checkAge() {
     let name = document.getElementById("name").value;
     let age = document.getElementById("age").value;
     let result = document.getElementById("result");
     if (name === "" || age === "") {
       result.textContent = "Please fill all fields";
       result.style.color = "yellow";
       return;
     }
     if (age >= 18) {
       result.textContent = "Welcome, " + name + "!";
       result.style.color = "lightgreen";
     } else {
       result.textContent = "Access denied. Under 18.";
       result.style.color = "red";
     }
   }
</script>
</body>
</html>
